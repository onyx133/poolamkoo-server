# Local development stack: postgres + one-shot migrations + api.
#   docker compose up --build
# Roles (created by deploy/db-init/01-app-role.sh): poolamkoo_admin is the bootstrap superuser,
# poolamkoo_owner (non-superuser) runs migrations, poolamkoo_app (DML only) is what the API uses.
# Passwords below are for local development only. Production uses deploy/ overrides and secrets.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poolamkoo_admin
      POSTGRES_PASSWORD: admin-dev-password
      POSTGRES_DB: poolamkoo
      # TCP always asks for a password; only the container-local socket stays trusted.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=trust'
      OWNER_DB_PASSWORD: owner-dev-password
      APP_DB_PASSWORD: app-dev-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poolamkoo_admin -d poolamkoo']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://poolamkoo_owner:owner-dev-password@postgres:5432/poolamkoo
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://poolamkoo_app:app-dev-password@postgres:5432/poolamkoo
      # Dev-only secrets (>= 32 bytes). Never reuse outside local development.
      SERVER_PEPPER: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      JWT_SECRET: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100
      DOCS_ENABLED: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Same hardening as production: the image must run with a read-only root filesystem.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
