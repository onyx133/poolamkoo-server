# Local development stack: postgres + one-shot migrations + api.
#   docker compose up --build
# The API connects as the least-privilege role `poolamkoo_app`; migrations run as the owner.
# Passwords below are for local development only. Production uses deploy/ overrides and secrets.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poolamkoo_owner
      POSTGRES_PASSWORD: owner-dev-password
      POSTGRES_DB: poolamkoo
      APP_DB_PASSWORD: app-dev-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poolamkoo_owner -d poolamkoo']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://poolamkoo_owner:owner-dev-password@postgres:5432/poolamkoo
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://poolamkoo_app:app-dev-password@postgres:5432/poolamkoo
      # Dev-only secrets (>= 32 bytes). Never reuse outside local development.
      SERVER_PEPPER: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      JWT_SECRET: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100
      DOCS_ENABLED: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
