# Port 80 for the API hostname only: ACME HTTP-01 challenges, redirect everything else to the
# API port. __API_HOST__ is a placeholder; render it when installing:
#   sed "s/__API_HOST__/$API_HOST/g" deploy/nginx/poolamkoo-http.conf \
#     | sudo tee /etc/nginx/conf.d/poolamkoo-http.conf >/dev/null
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name __API_HOST__;

    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/poolamkoo-acme;
    }

    location / {
        return 301 https://$host:2053$request_uri;
    }
}
