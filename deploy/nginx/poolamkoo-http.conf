# Port 80 for <api-host> only: ACME HTTP-01 challenges, redirect everything else
# to the API port. Mirrors the block already live on the host.
# Install as /etc/nginx/conf.d/poolamkoo-http.conf, then: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name <api-host>;

    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/poolamkoo-acme;
    }

    location / {
        return 301 https://$host:2053$request_uri;
    }
}
