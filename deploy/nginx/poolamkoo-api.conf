# PoolamKoo API: HTTPS on a dedicated port, proxying to the local Fastify process.
# __API_HOST__ is a placeholder for the public hostname. Render it when installing:
#   sed "s/__API_HOST__/$API_HOST/g" deploy/nginx/poolamkoo-api.conf \
#     | sudo tee /etc/nginx/conf.d/poolamkoo-api.conf >/dev/null
#   nginx -t && systemctl reload nginx
# Written for nginx 1.24 (`listen ... http2`; `http2 on;` needs >= 1.25.1).
# Self-contained: touches no other server block on the host.

# Use the caller's X-Request-Id when present, else nginx's own 32-hex id. The app accepts
# ^[A-Za-z0-9-]{8,64}$ and ignores anything else.
map $http_x_request_id $poolamkoo_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Outer per-client rate limit (the app has its own, finer limits behind this one). Keyed by
# the binary client address, so it costs 16 bytes per IPv6 client and 4 per IPv4 one.
# Zone names are global to the host's nginx: keep the poolamkoo_ prefix.
limit_req_zone $binary_remote_addr zone=poolamkoo_api:10m rate=20r/s;

server {
    listen 2053 ssl http2;
    listen [::]:2053 ssl http2;
    server_name __API_HOST__;

    ssl_certificate     /etc/poolamkoo/tls/fullchain.pem;
    ssl_certificate_key /etc/poolamkoo/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:poolamkoo_ssl:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # Privacy: no per-request access log (it would contain client IPs). error_log is global
    # to the host; it can mention client IPs for failed requests, so keep it at warn or above.
    access_log off;

    # The API caps bodies at 16 KiB; reject larger ones before they reach Node.
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    # Fastify's helmet also sets HSTS; hide the upstream copy so the header appears once.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The app compresses (br/gzip) itself; do not double-compress.
    gzip off;

    # 20 requests/s per client with a burst of 40, then 429. Rejections are logged at
    # "notice" so they stay out of an error_log kept at warn or above (the entry would
    # contain the client IP).
    limit_req zone=poolamkoo_api burst=40 nodelay;
    limit_req_status 429;
    limit_req_log_level notice;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        # Overwrite, never append: the client must not be able to forge its rate-limit key.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id      $poolamkoo_request_id;

        proxy_connect_timeout 3s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
    }
}
